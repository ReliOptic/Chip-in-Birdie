            <div class="page"><p class="text-component">The CFM56 has set the standard for single-aisle commercial jet engines. With more than 31,000* engines delivered, the CFM56 is the best-selling product line in commercial aviation history. It
powers the single-aisle jetliners from the world’s leading plane makers, Airbus and Boeing.

The CFM56 owes its success toits exceptional performance and reliability, built on the proven technological excellence of GEand Safran Aircraft Engines.

With dispatch reliability of close to 100% and unrivalled time on wing helping to drive down the cost of ownership, the engine now powers aircraft for more than 570 operators worldwide.</p>
<p class="text-component">A 50/50 JOINT COMPANY BETWEEN GE AND SAFRAN AIRCRAFT ENGINES, DEVELOPS, PRODUCES, AND MARKETS CFM56 ENGINES, WHICH NOW POWER MORE THAN 13,400 SINGLE-AISLE COMMERCIAL AND MILITARY JETLINERS WORLDWIDE.</p>

<p class="text-component">The CFM56-7B is the exclusive engine for the Boeing Next-Generation single-aisle airliner (737-600/-700/-800/-900/-900ER).

<p class="text-component">is designed to power commercial aircraft requiring 18,500 to 33,000 pounds of thrust. These all-time best seller engines are widely acknowledged as the most reliable of their generation.</p>
