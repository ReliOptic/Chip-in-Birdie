<style>
/* Layout: editor shell (slides | canvas | inspector) over a fixed 1600x900 slide stage; one dark look matching the deck */
:root{
  color-scheme:dark;
  --bg:#000000; --shell:#0c0c0c; --card:#151515; --raised:#1f1f1f; --line:#2d2d2d;
  --t1:#ffffff; --t2:#aaaaaa; --t3:#888888;
  --g:#76b900; --g-ink:#0b1200; --warn:#ffb300;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --sans:"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--t1);font:400 14px/20px var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{height:100%;display:grid;grid-template-rows:56px 1fr;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#bar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--shell);min-width:0}
#bar .name{font-weight:600;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
#bar .name i{width:12px;height:12px;border-radius:3px;background:var(--g)}
#bar .grow{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:6px;color:var(--t3);font:500 13px/16px var(--sans);white-space:nowrap;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.seg button:hover{color:var(--t1)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--t1);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;background:var(--raised);border:1px solid var(--line);font:500 13px/1 var(--sans);color:var(--t1);white-space:nowrap;transition:background-color 120ms var(--ease),border-color 120ms var(--ease)}
.btn:hover{background:#262626;border-color:#3a3a3a}
.btn:active{transform:scale(0.98)}
.btn.primary{background:var(--g);border-color:var(--g);color:var(--g-ink)}
.btn.primary:hover{background:#86c90f}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn:disabled,.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.btn svg,.ib svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.5;fill:none}
:is(.btn,.seg button,.thumb,.acard,.sw,.ib):focus-visible{outline:2px solid var(--g);outline-offset:2px}
#sync{width:10px;height:10px;border-radius:50%;border:2px solid var(--t3);flex:none;transition:background-color 160ms var(--ease),border-color 160ms var(--ease)}
#sync[data-s=shared]{background:var(--g);border-color:var(--g)}
#sync[data-s=saving]{background:var(--warn);border-color:var(--warn)}
#sync[data-s=error]{background:#e5484d;border-color:#e5484d}

#main{display:grid;grid-template-columns:232px minmax(0,1fr) 300px;min-height:0;min-width:0}
#main>*{min-width:0}
#rail{border-right:1px solid var(--line);background:var(--shell);display:flex;flex-direction:column;min-height:0}
#thumbs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.thumb{all:unset;cursor:pointer;display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = {t1:'var(--t1)', t2:'var(--t2)', t3:'var(--t3)', g:'var(--g)', ink:'var(--g-ink)', card:'var(--card)', raised:'var(--raised)'};
const SW = ['t1','t2','t3','g'];
const FILLS = ['g','card','raised','t3'];

/* ============ ASSETS: drawn from the CUDA deck, reusable on any slide ============ */
function lines(s){ return String(s || '').split('\n').map(x => x.trim()).filter(Boolean); }
function cells(s){ return String(s || '').split('|').map(x => x.trim()); }

function paintSVG(){
  const cpu = ['<rect x="270" y="16" width="20" height="40" rx="4" fill="#555"/>'];
  const pts = [];
  for (let k = 0; k < 28; k++){ const a = k / 28 * Math.PI * 2; pts.push([280 + 130 * Math.cos(a), 250 + 130 * Math.sin(a)]); }
  pts.push([235, 215], [325, 215]);
  for (let k = 0; k <= 10; k++){ const a = Math.PI * (0.15 + 0.7 * k / 10); pts.push([280 + 75 * Math.cos(a), 255 + 60 * Math.sin(a)]); }
  pts.forEach(([x, y], n) => cpu.push(`<circle class="dot an" style="animation-delay:${400 + n * 90}ms" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="#aaa"/>`));
  const gpu = [];
  const cols = 40, rows = 30, s = 12, ox = 40, oy = 64;
  for (let c = 0; c < cols; c++) gpu.push(`<rect x="${ox + c * s + 3}" y="16" width="6" height="28" rx="2" fill="#555"/>`);
  const ramp = ['#0c1304','#172507','#24380a','#3a5a06','#4f7a00','#62990a','#76b900','#9bd23a'];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const x = (c - 19.5) / 20, y = (r - 14.5) / 15;
    const head = Math.hypot(x / 0.42, (y + 0.28) / 0.55);
    const body = y > 0.35 ? Math.hypot(x / 0.95, (y - 1.25) / 0.85) : 9;
    let v = 0.18 + 0.12 * Math.sin(c * 0.4 + r * 0.25);
    if (head < 1) v = 0.95 - head * 0.45 + 0.08 * Math.cos(c * 0.9);
    else if (body < 1) v = 0.55 - body * 0.3;
    const k = Math.max(0, Math.min(7, Math.round(v * 7)));
    gpu.push(`<rect class="px an" x="${ox + c * s}" y="${oy + r * s}" width="${s - 1}" height="${s - 1}" fill="${ramp[k]}"/>`);
  }
  return [cpu.join(''), gpu.join('')];
}
let PAINT = null;

const ASSETS = {
  paintgun: {name:'물감총 시연 (CPU / GPU)', nw:1184, nh:520,

let slides = clone(BASE);           // working copy
let deck = '20';
let curId = null;
let selId = null;
let tab = 'props';
const undo = [];
const overridden = new Set();       // ids that differ from BASE (stored)

function inDeck(s, d = deck){ return !s.deleted && String(s.d).split(' ').includes(d); }
function ord(s, d = deck){ return d === '5' ? (s.o5 ?? 50) : (s.o20 ?? 50); }
function list(){ return slides.filter(s => inDeck(s)).sort((a, b) => ord(a) - ord(b)); }
function cur(){ return slides.find(s => s.id === curId); }
function curEl(){ const s = cur(); return s && s.els.find(e => e.id === selId); }
function nid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ============ SANITIZE (shared text is untrusted) ============ */
function clean(html){
  const root = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html').body.firstChild;
  const walk = node => { let out = ''; node.childNodes.forEach(n => {
    if (n.nodeType === 3) out += esc(n.textContent);
    else if (n.nodeType === 1){ const t = n.tagName, inner = walk(n);
      if (t === 'BR') out += '<br>';
      else if (t === 'B' || t === 'STRONG') out += '<b>' + inner + '</b>';
      else if (t === 'SMALL') out += '<small>' + inner + '</small>';
      else if (t === 'SPAN' && ['g', 't2', 't3'].includes(n.className)) out += `<span class="${n.className}">${inner}</span>`;
      else if (t === 'DIV' || t === 'P') out += (out && !out.endsWith('<br>') ? '<br>' : '') + inner;
      else out += inner; } }); return out; };
  return root ? walk(root) : '';
}

function elHTML(e, mode){

  const cls = ['el']; if (mode === 'present'){ if (e.anim === 'step') cls.push('fragment'); if (e.anim === 'fade') cls.push('an-rise'); }
  if (e.type === 'text'){
    const ts = `font-size:${e.size}px;line-height:${e.lh || 1.2};font-weight:${e.weight};color:${COLORS[e.color] || COLORS.t1};text-align:${e.align};${e.mono ? 'font-family:var(--mono);' : ''}${e.size >= 40 ? 'letter-spacing:-0.02em;' : ''}`;
    return `<div class="${cls.join(' ')}" data-id="${esc(e.id)}" style="${st}"><div class="txt" style="${ts}">${clean(e.html)}</div></div>`;
  }
  if (e.type === 'rect') return `<div class="${cls.join(' ')}" data-id="${esc(e.id)}" style="${st}background:${COLORS[e.fill] || COLORS.g};border-radius:${+e.radius || 0}px"></div>`;
  const a = ASSETS[e.asset]; if (!a) return '';
  const k = Math.min(e.w / a.nw, e.h / a.nh); const ox = (e.w - a.nw * k) / 2, oy = (e.h - a.nh * k) / 2;
  let inner = ''; try { inner = a.render(Object.assign({}, a.d, e.p || {})); } catch (_) { inner = ''; }
  return `<div class="${cls.join(' ')}" data-id="${esc(e.id)}" style="${st}"><div class="ab" style="width:${a.nw}px;height:${a.nh}px;transform:translate(${ox}px,${oy}px) scale(${k})">${inner}</div></div>`;
}

}

async function connect(){

const canvas = $('#canvas');
let drag = null;
canvas.addEventListener('pointerdown', ev => {
  if (editingText) { if (ev.target.closest('.editing')) return; finishText(); }
  const elNode = ev.target.closest('.el'); const s = cur(); if (!s) return;
  if (!elNode){ if (selId){ selId = null; renderCanvas(); renderPanel(); } return; }
  const id = elNode.dataset.id; const e = s.els.find(x => x.id === id); if (!e) return;

canvas.addEventListener('pointermove', ev => {

function setOrd(s, v){ if (deck === '5') s.o5 = v; else s.o20 = v; }
$('#bAdd').onclick = () => { const L = list(); const i = L.findIndex(s => s.id === curId);
  const s = {id:nid('n'), d:deck, o20:50, o5:50, els:[], notes:''}; const h = H('새 장표'); h.id = nid('e'); s.els.push(h); setOrd(s, between(i));
  slides.push(s); curId = s.id; selId = null; snapshot(); changed(s); renderAll(); };
$('#bDup').onclick = () => { const c = cur(); if (!c) return; const L = list(); const i = L.findIndex(s => s.id === curId);
  const s = clone(c); s.id = nid('n'); s.noIdx = c.noIdx; s.els.forEach(e => e.id = nid('e')); setOrd(s, between(i)); slides.push(s); curId = s.id; changed(s); renderAll(); };
function move(dir){ const L = list(); const i = L.findIndex(s => s.id === curId); const j = i + dir; if (i < 0 || j < 0 || j >= L.length) return;
  const a = L[i], b = L[j]; const oa = ord(a), ob = ord(b); setOrd(a, ob); setOrd(b, oa); if (oa === ob) setOrd(a, ob + dir * 0.01); changed(a); changed(b); renderAll(); }
$('#bUp').onclick = () => move(-1); $('#bDown').onclick = () => move(1);
$('#bText').onclick = addText; $('#bUndo').onclick = doUndo;
document.querySelectorAll('#bar .seg button').forEach(b => b.onclick = () => { deck = b.dataset.deck; selId = null; renderAll(); });
function setTab(){ document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === tab))); }
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; setTab(); renderPanel(); });

let notesT = null;
$('#notes').addEventListener('input', () => { const s = cur(); if (!s) return; s.notes = $('#notes').value; clearTimeout(notesT); notesT = setTimeout(() => { overridden.add(s.id); queueSave(s); }, 400); });

addEventListener('keydown', ev => {
  if (!$('#present').hidden) return;
  const typing = ev.target.closest && ev.target.closest('input,textarea,select,[contenteditable=true]');
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !typing){ ev.preventDefault(); doUndo(); return; }
  if (typing){ if (ev.key === 'Escape' && editingText){ finishText(); } return; }
  const s = cur(); const e = curEl();
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && e){ ev.preventDefault(); snapshot(); s.els = s.els.filter(x => x !== e); selId = null; changed(s, {panel:true}); }
  else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'd' && e){ ev.preventDefault(); snapshot(); const c = clone(e); c.id = nid('e'); c.x += 24; c.y += 24; s.els.push(c); selId = c.id; changed(s, {panel:true}); }
  else if (e && ev.key.startsWith('Arrow')){ ev.preventDefault(); snapshotOnce(); const d = ev.shiftKey ? 16 : 4;
    if (ev.key === 'ArrowLeft') e.x -= d; if (ev.key === 'ArrowRight') e.x += d; if (ev.key === 'ArrowUp') e.y -= d; if (ev.key === 'ArrowDown') e.y += d; changed(s, {panel:true}); }
  else if (!e && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')){ ev.preventDefault(); const L = list(); const i = L.findIndex(x => x.id === curId); const n = L[i + (ev.key === 'ArrowDown' ? 1 : -1)]; if (n){ curId = n.id; renderAll(); } }
  else if (ev.key === 'Escape' && selId){ selId = null; renderCanvas(); renderPanel(); }
  else if (ev.key === 'F5' || (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey))){ ev.preventDefault(); present(); }
  else if (ev.key === 't' || ev.key === 'T'){ addText(); }
});

/* ============ PRESENT (Reveal.js) ============ */
let rv = null; let wentFull = false;
function fmt(m){ if (m == null || m === '') return ''; const t = Math.round(parseFloat(m) * 60); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function present(){
  if (editingText) finishText();
  if (typeof Reveal === 'undefined') { return; }
  const L = list(); const start = Math.max(0, L.findIndex(s => s.id === curId));
  const ov = $('#present'); ov.hidden = false;
  ov.querySelector('.slides').innerHTML = L.map(s => `<section data-id="${esc(s.id)}"><div class="stage">${slideHTML(s, 'present')}</div></section>`).join('');
  rv = new Reveal(ov.querySelector('.reveal'), {width:1600, height:900, margin:0, minScale:0.05, maxScale:4, center:false, hash:false, history:false, embedded:true, keyboardCondition:null,
    controls:true, controlsTutorial:false, progress:true, transition:'fade', transitionSpeed:'fast', backgroundTransition:'none', overview:true, keyboard:{27: exitPresent, 78: toggleNotes}});
  rv.initialize().then(() => { rv.slide(start); updNotes(); });
  rv.on('slidechanged', updNotes); rv.on('fragmentshown', updNotes); rv.on('fragmenthidden', updNotes);
  const req = ov.requestFullscreen ? ov.requestFullscreen() : null;
  if (req && req.then) req.then(() => { wentFull = true; }).catch(() => {});
}
function toggleNotes(){ $('#pNotes').classList.toggle('on'); }
function updNotes(){
  if (!rv) return; const sec = rv.getCurrentSlide(); const s = slides.find(x => x.id === (sec && sec.dataset.id)); if (!s) return;
  const L = list().filter(x => !x.noIdx); const n = L.indexOf(s); const m = deck === '5' ? s.min5 : s.min;
  const pn = $('#pNotes'); pn.textContent = s.notes || '';
  const tm = document.createElement('div'); tm.className = 'tm'; tm.textContent = (n >= 0 ? `${n + 1} / ${L.length}` : '') + (m ? ' · ' + fmt(m) : ''); pn.prepend(tm);
  curId = s.id;
}
function exitPresent(){
  if (!rv) return; try { rv.destroy(); } catch (_) {} rv = null;
  const ov = $('#present'); ov.hidden = true; ov.querySelector('.slides').innerHTML = ''; $('#pNotes').classList.remove('on');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  wentFull = false; selId = null; renderAll();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && wentFull && rv) exitPresent(); });
$('#bPlay').onclick = present;
let hotT; $('#present').addEventListener('mousemove', () => { const o = $('#present'); o.classList.add('hot'); clearTimeout(hotT); hotT = setTimeout(() => o.classList.remove('hot'), 1600); });

/* ============ BOOT ============ */
new ResizeObserver(() => { fitCanvas(); fitThumbs(); }).observe($('#viewport'));
loadLocal(); renderAll(); fitCanvas(); setSync('local');
connect();
})();
</script>
